# MCUboot Application - Common Configuration
#
# Board-specific settings are in boards/<board>.conf

# Enable MCUboot support - adds 0x200 header offset
CONFIG_BOOTLOADER_MCUBOOT=y

# Enable MCUboot image manager for firmware upgrade state detection
CONFIG_IMG_MANAGER=y

# Enable MCUboot bootutil library for boot_write_img_confirmed()
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y

# MDFU (Microchip Device Firmware Update) over UART: interrupt-driven RX into a
# ring buffer, so the FIFO-less UART RX register is not overrun at 115200.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# GPIO for LED control
CONFIG_GPIO=y

# Enable serial console for UART output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Minimal kernel configuration
CONFIG_MAIN_STACK_SIZE=2048

# Enable system reboot for auto-restart after upgrade request
CONFIG_REBOOT=y

# Thread diagnostics and stack safety
CONFIG_THREAD_NAME=y          # Required for k_thread_name_set() to actually store the name
CONFIG_THREAD_MONITOR=y       # Enables runtime thread enumeration (kernel threads shell, thread_analyzer)
CONFIG_THREAD_STACK_INFO=y    # Exposes stack bounds per thread (needed for stack usage reporting)
CONFIG_INIT_STACKS=y          # Pre-fills stacks with 0xAA so high-water-mark is accurate
CONFIG_HW_STACK_PROTECTION=y  # MPU-based stack overflow guard (board has CONFIG_ARM_MPU=y)
