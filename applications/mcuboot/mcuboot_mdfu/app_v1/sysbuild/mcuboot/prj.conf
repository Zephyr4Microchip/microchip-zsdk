# MCUboot primary configuration — used by sysbuild as the CONF_FILE for the
# mcuboot image (replaces MCUboot's own prj.conf). Must include all settings
# that MCUboot's upstream prj.conf provides, plus project-specific additions.

# From MCUboot upstream prj.conf (required since this file replaces it)
CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_FLASH=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# Boot mode and signature
CONFIG_BOOT_SWAP_USING_MOVE=y
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Flash
CONFIG_FLASH_MAP=y

# Boot behavior
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_BOOTSTRAP=y

# Console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Peripherals
CONFIG_GPIO=y

# Required by flash driver (nvmctrl-g3) for ISR synchronization
CONFIG_MULTITHREADING=y
